name: release

# Publishes the GitHub release for a version tag: both EXE installers
# (Full and Core-Fetch), nothing else.
#
# Why this is a SEPARATE workflow instead of a job inside windows-build.yml:
# windows-build is path-filtered to desktop/**, and GitHub applies `paths` to
# tag pushes as well — so a tag pointing at a commit that only touched docs
# (or a tag created after the fact) would silently never fire it. Tag pushes
# here are never path-filtered, so a release can always be cut.
#
# It does NOT rebuild. It pulls the EXE artifact from the newest green
# windows-build run, so the released binary is exactly the one whose tests
# passed. GitHub's artifact blob storage is reachable from a runner (a local
# sandbox/proxy may not be), which is why publishing lives here.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, e.g. v3.6.19'
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Publish release (both EXE variants)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve the tag
        id: tag
        run: |
          set -euo pipefail
          TAG='${{ github.event.inputs.tag || github.ref_name }}'
          case "$TAG" in
            v*) ;;
            *) echo "::error::tag '$TAG' must start with 'v' (e.g. v3.6.19)"; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "releasing $TAG"

      # A runner has unrestricted network; a local sandbox often cannot reach
      # productionresultssa*.blob.core.windows.net at all.
      - name: Download the EXE artifact from the newest green build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID="$(gh api \
            "repos/${{ github.repository }}/actions/workflows/windows-build.yml/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].id')"
          [ -n "$RUN_ID" ] || { echo "::error::no successful windows-build run found"; exit 1; }
          echo "using windows-build run $RUN_ID"
          gh run download "$RUN_ID" \
            --repo "${{ github.repository }}" \
            --name MultiVPN-Windows-x64 \
            --dir dist
          # EXE only: drop the source-commit marker.
          rm -f dist/wireproxy-source-commit.txt
          test -n "$(ls dist/*.exe 2>/dev/null)" \
            || { echo "::error::the artifact contained no .exe"; exit 1; }
          # REGENERATE the checksum file. The one windows-build stages covers
          # every file in ITS stage dir, including the marker just deleted — so
          # shipping it verbatim would make `sha256sum -c SHA256SUMS.txt` fail
          # with "no such file" on a release that is otherwise fine.
          ( cd dist && sha256sum ./*.exe > SHA256SUMS.txt && cat SHA256SUMS.txt )
          ls -la dist

      # Both packaging variants ship in one release: the Full installer and the
      # Core-Fetch one that downloads cores on demand. Missing either means the
      # build we are releasing is not the build windows-build produced, so this
      # is a hard gate rather than a warning.
      - name: Verify the EXE names match the tag version
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          for WANT in "MultiVPN-${VERSION}.exe" "MultiVPN-${VERSION}-core-fetch.exe"; do
            if [ ! -f "dist/$WANT" ]; then
              echo "::error::dist has no $WANT — the newest green build is for a different version. Bump desktop/build.gradle.kts (val appVersion), let windows-build go green, then tag."
              ls -la dist
              exit 1
            fi
          done
          echo "releasing: $(ls dist/*.exe | tr '\n' ' ')"

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "release $TAG already exists — uploading assets (clobber)"
            gh release upload "$TAG" dist/* \
              --repo "${{ github.repository }}" --clobber
          else
            # Quoted heredoc: nothing expands inside it, and the VERSION
            # placeholder keeps the release text readable in the YAML.
            cat > notes.md <<'MD'
          Two Windows x64 installers, both with Settings -> Cores (check for core updates, per-core download, SHA-256 verification):

          * `MultiVPN-VERSION-core-fetch.exe` - **Core-Fetch** (~75 MB): about 65 MB smaller; each VPN engine is downloaded the first time its protocol is used.
          * `MultiVPN-VERSION.exe` - **Full** (~138 MB): every engine is bundled inside the installer.
          MD
            sed -i "s/VERSION/${VERSION}/g" notes.md
            gh release create "$TAG" dist/* \
              --repo "${{ github.repository }}" \
              --title "MultiVPN $VERSION" \
              --notes-file notes.md
          fi
          gh release view "$TAG" --repo "${{ github.repository }}" \
            --json url,assets \
            --jq '"\(.url)\n" + (.assets[] | "  \(.name)  \(.size) bytes")'
