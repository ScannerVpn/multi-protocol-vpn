name: windows-build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'desktop/**'
      - '.github/workflows/windows-build.yml'

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Package Windows EXE / MSI
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go (for the AWG-patched wireproxy)
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      # Invariant HANDOFF 5.24/5.x: the AWG 3.x patch must be applied via stdin.
      - name: Build patched wireproxy.exe (AmneziaWG 3.x)
        working-directory: ${{ runner.temp }}
        run: |
          git clone --depth 1 https://github.com/artem-russkikh/wireproxy-awg awgp
          cd awgp
          git apply < "${GITHUB_WORKSPACE}/desktop/wireproxy-awg-awg31.patch"
          go mod tidy
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" \
            -o "${GITHUB_WORKSPACE}/desktop/src/main/resources/bin/wireproxy/wireproxy.exe" \
            ./cmd/wireproxy

      # -SaveHashes pins SHA256s of every download on first run; later runs
      # fail hard on mismatch (supply-chain guard).
      - name: Fetch remaining cores (xray / sing-box / openvpn)
        working-directory: desktop
        shell: pwsh
        run: ./fetch-cores.ps1 -SaveHashes

      # v3.6.12: bundled default configs are injected from a repository
      # secret (VPN_SEED_LINKS_B64 = base64 of the links file) so real
      # credentials never live in the git tree, yet every released binary
      # still carries them. Absent secret = build ships without defaults.
      - name: Inject bundled default configs (from secret)
        shell: pwsh
        env:
          SEED_LINKS_B64: ${{ secrets.VPN_SEED_LINKS_B64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path (Join-Path 'desktop' 'src/main/resources/seed') 'links.txt'
          New-Item -ItemType Directory -Force -Path (Split-Path $out) | Out-Null
          if ($env:SEED_LINKS_B64) {
            [IO.File]::WriteAllBytes($out, [Convert]::FromBase64String($env:SEED_LINKS_B64))
            Write-Host "links.txt injected ($((Get-Item $out).Length) bytes)"
          } else {
            Write-Host 'VPN_SEED_LINKS_B64 not set — shipping without bundled defaults'
          }

      - name: Run tests (must stay green)
        working-directory: desktop
        run: ./gradlew.bat --no-daemon test

      # Portable app image + both installers (windows-latest ships WiX 3.x).
      - name: Package
        working-directory: desktop
        run: ./gradlew.bat --no-daemon packageDistributionForCurrentOS packageMsi packageExe

      - name: Stage artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $PWD 'stage'
          New-Item -ItemType Directory -Force $stage | Out-Null
          Compress-Archive -Path 'desktop/build/compose/binaries/main/app/MultiVPN' `
            -DestinationPath "$stage/MultiVPN-portable-win64.zip" -Force
          Copy-Item 'desktop/build/compose/binaries/main/exe/*.exe' $stage -ErrorAction SilentlyContinue
          Copy-Item 'desktop/build/compose/binaries/main/msi/*.msi' $stage -ErrorAction SilentlyContinue
          Get-ChildItem $stage | Format-Table Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MultiVPN-Windows-x64
          path: stage/*
          retention-days: 30
          if-no-files-found: error
