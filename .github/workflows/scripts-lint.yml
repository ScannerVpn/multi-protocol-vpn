name: scripts-lint

# The bash setup scripts under server/ (and their byte-identical twins in
# desktop/src/main/resources) are piped through SSH and executed as ROOT on
# every user's VPS. A syntax error there is invisible to the Kotlin build and
# would detonate mid-provisioning on a live server, so gate them with bash -n
# on every change.

on:
  push:
    paths:
      - 'server/**'
      - 'desktop/src/main/resources/*.sh'
      - 'desktop/watch-cores*.ps1'
      - '.github/workflows/cores-watch.yml'
      - '.github/workflows/scripts-lint.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'desktop/src/main/resources/*.sh'
      - 'desktop/watch-cores*.ps1'
      - '.github/workflows/cores-watch.yml'
      - '.github/workflows/scripts-lint.yml'

# Least privilege: this workflow only reads the repo.
permissions:
  contents: read

jobs:
  bash-syntax:
    name: bash -n on all server scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Fail fast and name the offending file: bash -n parses without
      # executing, so a green run means every script is syntactically
      # loadable by the same interpreter that will run it on the VPS.
      - name: Syntax-check every script
        run: |
          for f in server/*.sh; do
            if ! bash -n "$f"; then
              echo "::error::bash syntax error in $f"
              exit 1
            fi
            echo "OK $f"
          done

  # A cores-watch.yml that fails to parse, or whose watch-cores.ps1 has a
  # syntax error, means the supply-chain watcher silently stops watching —
  # indistinguishable from "nothing new upstream". Parse-gate both.
  workflow-yaml:
    name: YAML parse every workflow
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Parse .github/workflows/*.yml
        run: |
          python3 -c 'import yaml' 2>/dev/null || pip3 install --quiet pyyaml
          python3 - <<'PY'
          import glob, sys, yaml
          bad = 0
          for f in sorted(glob.glob('.github/workflows/*.yml')):
              try:
                  yaml.safe_load(open(f, encoding='utf-8'))
                  print('OK', f)
              except Exception as e:
                  bad += 1
                  print('FAIL', f, e, file=sys.stderr)
          sys.exit(1 if bad else 0)
          PY

  # The offline decision tests of the core watcher (fixture mode), matching
  # this repo's "a plain script that exits non-zero is the test" style. It
  # hits no network: -ReleasesJson feeds canned GitHub API payloads.
  watch-cores-selftest:
    name: watch-cores.ps1 fixture self-test
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run desktop/watch-cores-selftest.ps1
        shell: powershell
        working-directory: desktop
        run: ./watch-cores-selftest.ps1
